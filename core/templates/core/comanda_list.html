<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comandas</title>
</head>
<body>
    <h1>Comandas</h1>

```
{% for comanda in comandas %}
    <div>
        <h2>Comanda #{{ comanda.id }}</h2>

        <p>Mesa: {{ comanda.table.number }}</p>

        <p>Status: {{ comanda.get_status_display }}</p>

        <p>
            Aberta em:
            {{ comanda.opened_at|date:"d/m/Y H:i" }}
        </p>
    </div>

    <hr>
{% empty %}
    <p>Nenhuma comanda cadastrada.</p>
{% endfor %}

<a href="/mesas/">Voltar para mesas</a>
```

</body>
</html>
